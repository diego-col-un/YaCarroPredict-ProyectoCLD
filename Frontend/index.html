<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Predicción Titanic</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #101010;
            color: #d0d0d0;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 680px;
            padding: 30px;
        }

        .form-card {
            background: #1c1c1c;
            border-radius: 8px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        h1 {
            color: #e0e0e0;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .description {
            color: #999;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        label {
            color: #d0d0d0;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            height: 46px;
            padding: 0 14px;

            background: #101010;
            color: #d0d0d0;

            border: 1px solid #3a3a3a;
            border-radius: 5px;

            font-size: 16px;
            outline: none;

            transition: border-color 0.2s ease;
        }

        input:focus,
        select:focus {
            border-color: #777;
        }

        input::placeholder {
            color: #666;
        }

        select {
            cursor: pointer;
        }

        option {
            background: #1c1c1c;
            color: #d0d0d0;
        }

        .submit-button {
            width: 100%;
            height: 48px;

            margin-top: 10px;

            border: none;
            border-radius: 5px;

            background: #e0e0e0;
            color: #101010;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.1s ease;
        }

        .submit-button:hover {
            background: #ffffff;
        }

        .submit-button:active {
            transform: scale(0.99);
        }

        /* Responsive */

        @media (max-width: 600px) {

            body {
                align-items: flex-start;
            }

            .container {
                padding: 20px;
            }

            .form-card {
                padding: 25px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <section class="form-card">

            <h1>Predicción Titanic</h1>

            <p class="description">
                Introduce los datos del pasajero para realizar la predicción.
            </p>

           <form id="predictionForm">

    <div class="form-group">
        <label for="pclass">Pclass</label>

        <select id="pclass" name="Pclass" required>
            <option value="" selected disabled>
                Selecciona una clase
            </option>

            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
        </select>
    </div>

    <div class="form-group">
        <label for="sex">Sex</label>

        <select id="sex" name="Sex" required>
            <option value="" selected disabled>
                Selecciona el sexo
            </option>

            <option value="0">0</option>
            <option value="1">1</option>
        </select>
    </div>

    <div class="form-group">
        <label for="age">Age</label>

        <input
            type="number"
            id="age"
            name="Age"
            placeholder="Ej: 22"
            min="0"
            max="120"
            step="0.1"
            required
        >
    </div>

    <div class="form-group">
        <label for="sibsp">SibSp</label>

        <input
            type="number"
            id="sibsp"
            name="SibSp"
            placeholder="Ej: 1"
            min="0"
            step="1"
            required
        >
    </div>

    <div class="form-group">
        <label for="parch">Parch</label>

        <input
            type="number"
            id="parch"
            name="Parch"
            placeholder="Ej: 0"
            min="0"
            step="1"
            required
        >
    </div>

    <div class="form-group">
        <label for="fare">Fare</label>

        <input
            type="number"
            id="fare"
            name="Fare"
            placeholder="Ej: 7.2500"
            min="0"
            step="0.0001"
            required
        >
    </div>

    <button type="submit" class="submit-button">
        Realizar predicción
    </button>

</form>

    </main>
    <script src="api.js"></script>
</body>
</html>
